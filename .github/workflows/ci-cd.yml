# ═══════════════════════════════════════════════════════════════════════════
# EcoMove — Pipeline CI/CD GitHub Actions
# Jobs :
#   1. unit-tests        → JUnit + JaCoCo (bloque si couverture < 80%)
#   2. sonarqube         → Analyse statique + Quality Gate
#   3. build-jar         → Package Maven → JAR
#   4. docker-build-push → Build image Docker + Push sur Docker Hub
# ═══════════════════════════════════════════════════════════════════════════
name: EcoMove CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  # Nom de l'image sur Docker Hub : dockerhub-username/ecomove-platform
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ecomove-platform

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — TESTS UNITAIRES + COUVERTURE JACOCO
  # ─────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "Tests & Couverture JaCoCo"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout du code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # requis par SonarQube

      - name: "Setup Java ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: "Tests + JaCoCo"
        run: mvn clean verify -Dspring.profiles.active=test
        # Bloque automatiquement si couverture < 80% (config dans pom.xml)

      - name: "Upload rapport JaCoCo"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — ANALYSE SONARQUBE
  # ─────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: "Analyse SonarQube + Quality Gate"
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: "Cache SonarQube"
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: "Compilation + rapport JaCoCo"
        run: mvn clean verify -DskipTests=false -Dspring.profiles.active=test

      - name: "Analyse SonarQube"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=RUMTD_ecomove-platform \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      #- name: "Quality Gate"
       # uses: SonarSource/sonarqube-quality-gate-action@master
        #timeout-minutes: 5
        #env:
         # SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — BUILD JAR
  # ─────────────────────────────────────────────────────────────────────────
  build-jar:
    name: "Build JAR Maven"
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: "Package JAR"
        run: mvn package -DskipTests

      - name: "Upload JAR"
        uses: actions/upload-artifact@v4
        with:
          name: ecomove-jar
          path: target/ecomove-platform-*.jar
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4 — BUILD IMAGE DOCKER + PUSH DOCKER HUB
  #
  # Ce job :
  #   1. Télécharge le JAR produit par le Job 3
  #   2. Construit l'image Docker via le Dockerfile
  #   3. Tag l'image avec la version + 'latest'
  #   4. Push l'image sur Docker Hub
  #
  # Secrets requis dans GitHub :
  #   DOCKERHUB_USERNAME → votre nom d'utilisateur Docker Hub
  #   DOCKERHUB_TOKEN    → Access Token Docker Hub (pas le mot de passe)
  #
  # L'image sera disponible sur :
  #   docker pull votre-username/ecomove-platform:latest
  # ─────────────────────────────────────────────────────────────────────────
  docker-build-push:
    name: "Build Image Docker + Push Docker Hub"
    runs-on: ubuntu-latest
    needs: build-jar
    # Seulement sur push vers main (pas les Pull Requests)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "Checkout du code"
        uses: actions/checkout@v4

      - name: "Télécharger le JAR"
        uses: actions/download-artifact@v4
        with:
          name: ecomove-jar
          path: target/
        # Le JAR est placé dans target/ pour que le Dockerfile le trouve

      - name: "Connexion à Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          # DOCKERHUB_TOKEN = Access Token (Settings > Security > New Access Token)
          # Ne jamais utiliser le mot de passe Docker Hub directement

      - name: "Extraire les métadonnées Docker"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=1.0.0
          # Tags générés :
          #   votre-username/ecomove-platform:latest
          #   votre-username/ecomove-platform:sha-abc1234
          #   votre-username/ecomove-platform:1.0.0

      - name: "Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3
        # Buildx permet le build multi-plateforme et le cache avancé

      - name: "Build et Push de l'image"
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # cache-from/to : cache Docker entre les runs GitHub Actions
          # Évite de reconstruire les layers inchangées → build 3x plus rapide

      - name: "Résumé du déploiement"
        run: |
          echo "## Image Docker publiée ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image :** \`${{ env.DOCKER_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pour utiliser l'image :**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.DOCKER_IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker run -p 8080:8080 ${{ env.DOCKER_IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          # Ce résumé apparaît dans l'onglet Actions de GitHub
