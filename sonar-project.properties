# ═══════════════════════════════════════════════════════════════════════════
# SonarQube — Configuration du projet EcoMove
# ═══════════════════════════════════════════════════════════════════════════

# Identification
sonar.projectKey=ecomove-platform
sonar.projectName=EcoMove Platform
sonar.projectVersion=1.0

# Sources Java
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Rapport de couverture JaCoCo (généré par mvn verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions (ne pas analyser)
sonar.exclusions=\
  **/EcoMoveApplication.java,\
  **/model/**,\
  **/repository/**

# Seuils Quality Gate (configurés côté SonarQube server)
# - Couverture de code : minimum 80%
# - Duplication       : maximum 3%
# - Bugs critiques    : 0
# - Vulnerabilites    : 0

sonar.sourceEncoding=UTF-8
