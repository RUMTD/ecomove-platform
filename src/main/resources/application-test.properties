# ═══════════════════════════════════════════════════════════
# EcoMove — Configuration Test (H2 en mémoire)
# Activé par : -Dspring.profiles.active=test
# ═══════════════════════════════════════════════════════════

# H2 base en mémoire (recrée à chaque test)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# H2 Console (pour inspecter la BDD en dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (clé fixe pour les tests)
jwt.secret=test_secret_key_min_256_bits_ecomove_test_env_only
jwt.expiration.ms=3600000

# Logs plus verbeux en test
logging.level.com.ecomove=DEBUG
