spring.application.name=ecomove-platform

# Base de données
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecomove}
spring.datasource.username=${DB_USER:ecomove}
spring.datasource.password=${DB_PASSWORD:ecomove_secret}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Serveur
server.port=8080

# JWT
jwt.secret=${JWT_SECRET:ecomove_jwt_secret_key_min_256_bits_pour_hs256_algorithm}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────
# URL Swagger UI  : http://localhost:8080/swagger-ui.html
# URL JSON spec   : http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.api-docs.path=/v3/api-docs
